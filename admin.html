<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CrownEarn Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#241b4b;--mute:#6f6a8f;--pri:#6a4cf5;--pd:#4b33c4;--gold:#ffc83d;--gd:#d99a00;--line:#e6e0fb;--soft:#efeaff;--ok:#16b980;--od:#0a7d57;--bad:#e0475b;--bd:#a82638}
@media(prefers-color-scheme:dark){:root{--bg:#14102b;--card:#1e1940;--ink:#f0edff;--mute:#a9a3cf;--line:#2e2860;--soft:#2a2358}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Sora',system-ui,sans-serif}
body{padding-top:env(safe-area-inset-top,0px)}
main{max-width:640px;margin:0 auto;padding:6px 14px 120px}
h1{font:800 24px/1.3 'Sora',system-ui,sans-serif;margin:10px 2px 2px}
h2{font:800 19px/1.3 'Sora',system-ui,sans-serif;margin:22px 2px 2px}
.hd{font:800 22px/1.4 'Sora',system-ui,sans-serif}
.sec{font:800 18px/1.3 'Sora',system-ui,sans-serif}
.ah{max-width:640px;margin:0 auto;padding:12px 16px 4px;display:flex;align-items:center;gap:12px}
.ah img{width:46px;height:46px;border-radius:14px;box-shadow:0 3px 0 var(--pd)}
.at{font:800 22px/1.2 'Sora',system-ui,sans-serif;background:linear-gradient(90deg,#c98a00,#ffc83d,#c98a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(90,60,0,.25))}
.as{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mute{color:var(--mute);font-size:14px;word-break:break-word}
button,a.b{font:inherit;font-family:'Sora',system-ui,sans-serif;font-weight:700;border:0;border-bottom:4px solid var(--pd);border-radius:14px;padding:6px 16px;background:var(--pri);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
button:active{transform:translateY(2px);border-bottom-width:2px}
button.ok{background:var(--ok);border-color:var(--od)}
button.no{background:var(--bad);border-color:var(--bd)}
button.o,a.b.o{background:var(--soft);color:var(--pri);border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{width:100%;font:inherit;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-weight:700;margin:12px 0 4px}
.tag{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--pri);font-weight:700;white-space:nowrap}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:none}
.c0{background:#d9f5e8}.c1{background:#fff0c4}.c2{background:#dfe8ff}.c3{background:#ffe0e6}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stl{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 10px;text-align:center}
.stl span{display:block;font-size:13px;color:var(--mute)}
.stl b{display:block;font:800 22px/1.25 'Sora',system-ui,sans-serif}
.stl.w2{grid-column:1/-1;color:#fff;border:0;padding:16px}
.stl.w2 span{color:rgba(255,255,255,.92)}
.stl.w2 b{font-size:30px}
.stl.good{background:linear-gradient(150deg,#16b980,#0a7d57);box-shadow:0 6px 0 #07583e}
.stl.bad{background:linear-gradient(150deg,#e0475b,#a82638);box-shadow:0 6px 0 #7a1b29}
.grp{background:var(--card);border:2px solid var(--line);border-radius:22px;margin-top:12px;overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"▾";margin-inline-start:auto;color:var(--mute);transition:transform .2s}
.grp[open]>summary::after{transform:rotate(180deg)}
.grp .gb{padding:0 14px 14px}
.grp .card{border-radius:16px;margin-top:10px;background:var(--bg)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);max-width:620px;display:flex;gap:2px;padding:6px;background:var(--card);border:2px solid var(--line);border-radius:99px;box-shadow:0 10px 30px rgba(36,27,75,.22);z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;color:var(--mute);border:0;border-radius:99px;padding:5px 1px;font-size:11px;line-height:1.15;min-width:0}
nav button::before{display:block;font-size:20px;line-height:1.25}
nav button:nth-child(1)::before{content:"📥"}nav button:nth-child(2)::before{content:"📋"}nav button:nth-child(3)::before{content:"👥"}
nav button:nth-child(4)::before{content:"💬"}nav button:nth-child(5)::before{content:"⚙️"}nav button:nth-child(6)::before{content:"🎰"}
nav button.on{background:var(--pri);color:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:14px;z-index:60;max-width:92%;text-align:center}
</style>
<link rel="stylesheet" href="theme.css?v=6">
</head>

<body class="adm">
<header class="ah"><img src="icon-192.png?v=2" alt="" width="46" height="46" onerror="this.style.display='none'"><div><div class="at">CrownEarn Admin 👑</div><div class="as">Control room</div></div></header>
<main id="app"><div class="card">Loading…</div></main>
<nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>')</script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>')</script>
<script src="admin.js?v=13"></script>
</body>
</html>
