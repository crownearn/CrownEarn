<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#241b4b;--mute:#6f6a8f;--pri:#6a4cf5;--pd:#4b33c4;--gold:#ffc83d;--gd:#d99a00;--mint:#16b980;--line:#e6e0fb;--soft:#efeaff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14102b;--card:#1e1940;--ink:#f0edff;--mute:#a9a3cf;--line:#2e2860;--soft:#2a2358}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:14px 16px 110px}
.hd{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.5}
.sec{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:19px;margin:22px 2px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{background:var(--card);border:2px solid var(--gold);border-radius:99px;padding:2px 14px;font-weight:700;white-space:nowrap}
.hero{background:linear-gradient(150deg,#8a63ff,#5a3be0);color:#fff;border-radius:28px;padding:20px;margin-top:12px;box-shadow:0 8px 0 #4129b0,0 18px 30px rgba(74,50,190,.3)}
.hr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero small{opacity:.9;font-size:14px}
.big{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:46px;line-height:1.1}
.mas{flex:none;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.mas{animation:none}}
.bub{background:rgba(255,255,255,.18);border-radius:16px;padding:8px 14px;margin-top:14px;font-size:15px}
.pb{height:16px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,#ffe07a,#ffc83d);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);transition:width .8s}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gr{display:flex;align-items:center;gap:12px}
.days{display:flex;justify-content:space-between;margin:12px 0}
.days b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--mute);font-size:14px}
.days b.d{background:var(--gold);color:#4a3200}
.days b.t{border:3px dashed var(--pri);color:var(--pri);background:var(--card)}
.ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none}
.c0{background:#d9f5e8}.c1{background:#fff0c4}.c2{background:#dfe8ff}.c3{background:#ffe0e6}
.rw{display:inline-block;background:#fff0c4;color:#7a5200;font-weight:700;font-size:13px;border-radius:99px;padding:1px 12px}
.tag{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--pri);font-weight:700;white-space:nowrap}
.mute{color:var(--mute);font-size:14px}
button{font:inherit;font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;border:0;border-bottom:4px solid var(--pd);border-radius:14px;padding:6px 18px;background:var(--pri);color:#fff;cursor:pointer}
button:active{transform:translateY(2px);border-bottom-width:2px}
button.g{background:var(--gold);color:#4a3200;border-color:var(--gd)}
button.o{background:var(--soft);color:var(--pri);border-color:var(--line)}
button.w{width:100%;padding:10px;font-size:18px}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;text-align:center;font-size:13px;line-height:1.4}
.bd div{opacity:.35;filter:grayscale(1)}
.bd div.on{opacity:1;filter:none}
.bd span{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;background:var(--soft);font-size:26px}
.wc{background:linear-gradient(150deg,#16b980,#0a7d57);color:#fff;border-radius:28px;padding:22px;box-shadow:0 8px 0 #07583e,0 18px 30px rgba(7,88,62,.3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;text-align:center}
.grid3 .card{margin:0}.grid3 b{display:block;font-size:24px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px;box-shadow:0 10px 30px rgba(36,27,75,.2);width:100%;max-width:420px}
nav button{flex:1;background:none;color:var(--mute);border:0;padding:4px;font-size:14px;border-radius:99px}
nav button.on{background:var(--pri);color:#fff}
nav span{display:block;font-size:20px;line-height:1.3}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:14px;font-size:15px;z-index:60;max-width:92%;text-align:center}
.ov{position:fixed;inset:0;background:rgba(20,10,60,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.ov.mid{align-items:center;padding:20px}
.sh{background:var(--card);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.win{background:var(--card);border-radius:28px;padding:22px;text-align:center;width:100%;max-width:340px}
.ms{display:flex;gap:8px;margin:10px 0}
.ms button{flex:1;background:var(--soft);color:var(--ink);border:2px solid transparent}
.ms button.on{border-color:var(--gold)}
input{width:100%;font:inherit;font-size:18px;padding:11px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:left;direction:ltr}
.cf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{top:105%;opacity:.5}}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.qa button{display:block;padding:8px 4px;font-size:14px;line-height:1.5}
.qa span{display:block;font-size:24px}
.tp{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tp button{background:var(--soft);color:var(--ink);border:2px solid transparent;padding:2px 14px;font-size:14px}
.tp button.on{border-color:var(--pri);color:var(--pri)}
label{display:block;font-weight:700;margin:12px 0 4px}
.sum{background:var(--soft);border-radius:16px;padding:12px;margin-top:12px;font-size:15px}
.warn{background:#fff3cd;color:#6b4a00;border-radius:14px;padding:8px 12px;font-size:13px;margin-top:8px}
.mc{background:linear-gradient(150deg,#8a63ff,#5a3be0);color:#fff;border-radius:28px;padding:20px;margin-top:14px;box-shadow:0 8px 0 #4129b0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rt{text-align:right;direction:rtl}
nav button{font-size:13px}
a.bt{display:inline-block;text-decoration:none;font-weight:700;border-radius:14px;padding:6px 14px;background:var(--soft);color:var(--pri);font-size:14px}
.sh{max-height:90vh;overflow:auto}
</style>
</head>
<body>
<script>
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;try{if(localStorage.getItem('noinst'))return}catch(x){}
 const b=document.createElement('div');b.id='ib';b.style.cssText='position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:70;background:#fff;color:#241b4b;border:2px solid #ffc83d;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:700';
 b.innerHTML='<span style="flex:1">📲 Install CrownEarn on your phone</span><button id="ibi" style="background:#6a4cf5;color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit">Install</button><button id="ibx" aria-label="Close" style="background:none;border:0;font-size:18px;color:#6f6a8f">✕</button>';
 document.body.appendChild(b);document.getElementById('ibi').onclick=async()=>{b.remove();dip.prompt();await dip.userChoice};
 document.getElementById('ibx').onclick=()=>{b.remove();try{localStorage.setItem('noinst','1')}catch(x){}}});
addEventListener('appinstalled',()=>{const b=document.getElementById('ib');if(b)b.remove()});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
